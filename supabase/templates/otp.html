<!-- SLSWCA sign-in email. Paste into Supabase → Auth → Email Templates → "Magic Link" for the hosted project. -->
<div style="background:#131210;padding:40px 24px;font-family:Arial,Helvetica,sans-serif;color:#F5F1E8">
  <div style="max-width:480px;margin:0 auto">
    <p style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#F0A83B;margin:0 0 16px">SLSWCA · MEMBER SIGN-IN</p>
    <p style="font-size:16px;line-height:1.6;color:#A39E93;margin:0 0 24px">Enter this code to sign in. It expires in 1 hour.</p>
    <p style="font-size:40px;font-weight:700;letter-spacing:.3em;margin:0 0 24px;color:#F5F1E8">{{ .Token }}</p>
    <p style="font-size:13px;line-height:1.6;color:#8A8478;margin:0">Didn't request this? You can ignore this email. Nobody can sign in without the code.</p>
  </div>
</div>
